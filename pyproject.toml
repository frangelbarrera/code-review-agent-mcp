[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent-mcp"
version = "0.1.0"
description = "An MCP server that reviews your code the way a kernel maintainer would: bluntly, technically, without diplomacy."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Frangel Raul Crespo Barrera", email = "201400231+frangelbarrera@users.noreply.github.com"},
]
keywords = ["mcp", "model-context-protocol", "code-review", "ai", "llm", "blunt", "kernel-style"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.27.0",
    "pydantic>=2.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[project.scripts]
code-review-agent-mcp = "code_review_agent.server:main"

[project.urls]
Homepage = "https://github.com/frangelbarrera/code-review-agent-mcp"
Repository = "https://github.com/frangelbarrera/code-review-agent-mcp"
Issues = "https://github.com/frangelbarrera/code-review-agent-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
pythonpath = ["src", "."]
